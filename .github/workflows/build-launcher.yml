name: Build TV launcher

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: write   # publish each build as a release for the TV's updater

jobs:
  build:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from Oct 2026 and the Android SDK setup broke there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (platform 34, build-tools 34)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0"

      - name: Version this build
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Put the compiler errors in an annotation, readable without downloading the log.
            msg=$(grep -E "error:|warning: \[|e: |What went wrong|> " build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
          fi
          exit "$status"

      - name: Check the APK is signed with the repo key
        run: |
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          WANT=$(keytool -list -v -keystore launcher/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          GOT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "repo key: $WANT"; echo "apk key:  $GOT"
          [ -n "$GOT" ] && [ "$WANT" = "$GOT" ]

      - name: Publish release for the TV's updater
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp launcher/app/build/outputs/apk/release/app-release.apk out/tvhome.apk
          echo "$VERSION_CODE" > out/version.txt
          gh release delete "v$VERSION_CODE" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION_CODE" out/tvhome.apk out/version.txt \
            --title "TV Home build $VERSION_CODE" --notes "Built from ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" --latest
          # Keep the five newest releases.
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
