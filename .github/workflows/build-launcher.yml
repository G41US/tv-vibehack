name: Build TV launcher

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: write   # publish each build as a release for the TV's updater

jobs:
  build:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from Oct 2026 and the Android SDK setup broke there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (platform 34, build-tools 34)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0"

      - name: Load the signing key
        env:
          TVHOME_SIGNING: ${{ secrets.TVHOME_SIGNING }}
        run: |
          # TVHOME_SIGNING is the base64 of the release keystore (PKCS12, alias tvhome). The secret
          # itself is what's protected; the keystore's own password is a fixed internal one. Without
          # the secret the code is still built (to catch errors) but nothing is published.
          if [ -z "$TVHOME_SIGNING" ]; then
            echo "HAVE_KEY=0" >> "$GITHUB_ENV"
            exit 0
          fi
          b64="${TVHOME_SIGNING##*:}"   # an older "password:key" value still works for its key part
          printf '%s' "$b64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/tvhome.p12" 2>/dev/null || true
          if ! keytool -list -storetype pkcs12 -keystore "$RUNNER_TEMP/tvhome.p12" -storepass tvhome -alias tvhome \
               >"$RUNNER_TEMP/kt.err" 2>&1; then
            why=$(grep -v JAVA_TOOL "$RUNNER_TEMP/kt.err" | head -c 200 | tr '\n' ' ')
            echo "::error title=Signing key unreadable::$why (key text ${#b64} chars, expected 4600). Paste the whole TVHOME_SIGNING_v2.txt as the secret."
            exit 1
          fi
          echo "HAVE_KEY=1" >> "$GITHUB_ENV"
          echo "TVHOME_KEYSTORE=$RUNNER_TEMP/tvhome.p12" >> "$GITHUB_ENV"
          echo "TVHOME_KEYSTORE_PASSWORD=tvhome" >> "$GITHUB_ENV"

      - name: Version this build
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Put the compiler errors in an annotation, readable without downloading the log.
            msg=$(grep -E "error:|What went wrong|^\* What|^> [^T]|^ +> " build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
          fi
          exit "$status"

      - name: Check the APK is signed with the TV Home release key
        if: env.HAVE_KEY == '1'
        run: |
          # Public fingerprint of the release certificate. Boxes only accept updates signed with it.
          WANT=9f5655ba967f66efb4a6e4f50c1d79ce58a80132f25abaea5063b90dd53f18ba
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          GOT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "expected: $WANT"; echo "apk:      $GOT"
          [ "$WANT" = "$GOT" ] || { echo "::error title=Wrong signing key::The APK is not signed with the TV Home release key."; exit 1; }
          rm -f "$TVHOME_KEYSTORE"

      - name: Publish to the beta channel
        # Every build goes to one rolling pre-release, "beta". Boxes on the Beta channel get it;
        # everyone else stays on the latest stable release until "Release beta to everyone" runs.
        if: github.ref == 'refs/heads/main' && env.HAVE_KEY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          cp "$APK" out/tvhome.apk            # new installs (Downloader code, web page)
          cp "$APK" out/tvhome-update.apk     # updates from TVs, counted separately
          echo "$VERSION_CODE" > out/version.txt
          git log -1 --format=%s "$GITHUB_SHA" > out/notes.txt
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --prerelease --target "$GITHUB_SHA" \
              --title "TV Home beta" --notes "Newest build for boxes on the Beta channel."
          fi
          # APKs first, version.txt last, so a TV never sees a version whose APK isn't there yet.
          gh release upload beta out/tvhome.apk out/tvhome-update.apk out/notes.txt --clobber
          gh release upload beta out/version.txt --clobber
          gh release edit beta --prerelease --title "TV Home beta (build $VERSION_CODE)" \
            --notes "Build $VERSION_CODE: $(cat out/notes.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk

      - name: Fail when the signing key is missing
        if: env.HAVE_KEY != '1'
        run: |
          echo "::error title=No signing key::Built, but not published. Add the TVHOME_SIGNING secret: repo Settings > Secrets and variables > Actions > New repository secret."
          exit 1
