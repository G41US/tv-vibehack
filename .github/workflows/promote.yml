name: Release beta to everyone

# Run this from the Actions tab once the beta build works on your own box. It publishes the
# current beta as the new stable release, which every TV Home on the Stable channel (and the
# Downloader code) picks up.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new, shown on people's TVs (one or two short lines). Empty = the beta's note."
        required: false
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the beta as the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOTES: ${{ inputs.notes }}
        run: |
          mkdir out && cd out
          gh release download beta -R "$REPO" -p tvhome.apk -p tvhome-update.apk -p version.txt -p notes.txt
          v=$(tr -dc 0-9 < version.txt)
          [ -n "$v" ] || { echo "::error::The beta has no version.txt"; exit 1; }
          if [ -n "$NOTES" ]; then printf '%s\n' "$NOTES" > notes.txt; fi
          if gh release view "v$v" -R "$REPO" >/dev/null 2>&1; then
            echo "::error title=Already released::Build $v is already the stable release."
            exit 1
          fi
          gh release create "v$v" tvhome.apk tvhome-update.apk version.txt notes.txt -R "$REPO" \
            --title "TV Home build $v" --notes-file notes.txt --latest
          echo "::notice title=Released::Build $v is now the stable release: $(cat notes.txt)"
