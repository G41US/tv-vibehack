plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 34
        // CI sets VERSION_CODE (1000 + run number) so the TV's updater can tell builds apart.
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '2')
        versionName "2.${System.getenv('VERSION_CODE') ?: '0'}"
    }

    // Release builds are signed with the key in the TVHOME_SIGNING secret (see the workflow), so only
    // builds from this repo can update TV Home on people's boxes. Local builds without it fall back to
    // the machine's own debug key.
    signingConfigs {
        release {
            def ks = System.getenv('TVHOME_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('TVHOME_KEYSTORE_PASSWORD')
                keyAlias 'tvhome'
                keyPassword System.getenv('TVHOME_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('TVHOME_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'com.google.zxing:core:3.5.3'   // guest Wi-Fi QR code
}
