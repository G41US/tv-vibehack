<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TV VibeHack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">V</span><span>TV VibeHack</span></div>
      <div class="clock" id="clock" aria-label="Current time">--:--</div>
    </header>
    <section class="hero" aria-labelledby="welcome">
      <p class="eyebrow">YOUR TV. YOUR WAY.</p>
      <h1 id="welcome">Everything you watch.<br><span>Nothing in your way.</span></h1>
      <p class="subheading">A clean home for your favourite apps.</p>
    </section>
    <section class="section" aria-labelledby="apps-heading">
      <div class="section-head"><h2 id="apps-heading">Your apps</h2><p>Use the remote to navigate</p></div>
      <div class="app-grid" id="app-grid" role="list"></div>
    </section>
    <footer><span id="platform-status">TV VibeHack preview</span><span>↑ ↓ ← → Navigate · OK Select · Back Return</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
